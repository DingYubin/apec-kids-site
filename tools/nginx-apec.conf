# 《小鹏友的APEC朋友圈》静态站点 —— Nginx 配置
# 部署位置：/etc/nginx/sites-available/apec（软链到 sites-enabled/apec）
# 站点目录：/var/www/apec
server {
    listen 80 default_server;
    listen [::]:80 default_server;
    server_name _;

    root /var/www/apec;
    index index.html;

    charset utf-8;

    location / {
        try_files $uri $uri/ =404;
    }

    # 静态资源：缓存 7 天，评审期加载更快
    location ~* \.(?:css|js|webp|png|jpe?g|svg|ico|webm|mp4|woff2?)$ {
        expires 7d;
        add_header Cache-Control "public";
        try_files $uri =404;
    }

    gzip on;
    gzip_min_length 1024;
    gzip_types text/css application/javascript image/svg+xml text/plain;

    access_log /var/log/nginx/apec.access.log;
    error_log  /var/log/nginx/apec.error.log;
}
