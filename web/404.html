<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<title>404 · 这只小鹏友迷路了 ｜ 小鹏友的APEC朋友圈</title>
<style>
  :root{
    --ink:#17345f;--ink-2:#586c8e;--blue:#1f7ae0;--blue-d:#0e4f9c;
    --sun:#ffc93c;--paper:#fffdf8;--line:rgba(255,255,255,.42);
  }
  *{box-sizing:border-box}
  html,body{min-height:100%}
  body{
    margin:0;min-height:100vh;overflow-x:hidden;color:var(--ink);
    font-family:"PingFang SC","Hiragino Sans GB","Microsoft YaHei",system-ui,-apple-system,sans-serif;
    background:
      radial-gradient(circle at 18% 18%,rgba(255,255,255,.9) 0 2px,transparent 3px),
      radial-gradient(circle at 72% 12%,rgba(255,255,255,.8) 0 2px,transparent 3px),
      radial-gradient(circle at 86% 32%,rgba(255,255,255,.72) 0 2px,transparent 3px),
      radial-gradient(circle at 55% 24%,rgba(255,255,255,.65) 0 1.5px,transparent 3px),
      radial-gradient(ellipse at 50% 105%,#38a9d5 0 30%,transparent 31%),
      linear-gradient(165deg,#8ed8f4 0%,#ccefff 46%,#fff6d8 100%);
  }
  body::before{
    content:"";position:fixed;left:0;right:0;bottom:0;height:23vh;pointer-events:none;
    background:
      linear-gradient(180deg,rgba(55,163,204,.15),rgba(34,129,173,.52)),
      repeating-linear-gradient(105deg,transparent 0 48px,rgba(255,255,255,.18) 49px 51px,transparent 52px 104px);
    clip-path:polygon(0 28%,9% 34%,19% 22%,30% 35%,42% 18%,55% 31%,67% 20%,78% 34%,90% 24%,100% 36%,100% 100%,0 100%);
  }
  .brand{
    position:relative;z-index:2;display:flex;justify-content:center;align-items:center;gap:9px;
    padding:24px 20px 8px;color:#224a7d;font-weight:800;letter-spacing:.02em;
  }
  .brand span{font-size:24px}
  main{
    position:relative;z-index:2;width:min(720px,calc(100vw - 40px));margin:34px auto 70px;
    padding:38px 54px 42px;text-align:center;border:1px solid var(--line);border-radius:34px;
    background:rgba(255,253,248,.82);backdrop-filter:blur(14px);
    box-shadow:0 28px 70px rgba(28,72,122,.18),inset 0 1px 0 rgba(255,255,255,.9);
  }
  .badge{
    display:inline-block;margin:0 0 12px;padding:6px 15px;border-radius:999px;
    background:#e7f3ff;color:var(--blue-d);font-size:13px;font-weight:800;letter-spacing:.08em;
  }
  .bird{
    width:94px;height:94px;margin:6px auto 4px;display:grid;place-items:center;
    border-radius:50%;font-size:55px;line-height:1;transform:rotate(-7deg);
    background:linear-gradient(155deg,#dff3ff,#9dd5ff);
    box-shadow:0 13px 30px rgba(31,122,224,.2),inset 0 0 0 2px rgba(255,255,255,.8);
    animation:hover 3.2s ease-in-out infinite;
  }
  @keyframes hover{50%{transform:translateY(-7px) rotate(5deg)}}
  .code{
    margin:-8px 0 -6px;color:rgba(31,122,224,.12);font-size:clamp(82px,18vw,150px);
    font-weight:900;line-height:1;letter-spacing:.03em;
  }
  h1{margin:0 0 12px;font-size:clamp(28px,4vw,42px);line-height:1.22;letter-spacing:.01em}
  .lead{margin:0 auto;max-width:520px;color:var(--ink-2);font-size:16px;line-height:1.9}
  .actions{display:flex;justify-content:center;gap:12px;flex-wrap:wrap;margin:28px 0 18px}
  .btn{
    display:inline-flex;align-items:center;justify-content:center;min-width:154px;
    padding:12px 22px;border-radius:999px;text-decoration:none;font-size:14.5px;font-weight:800;
    transition:transform .18s ease,box-shadow .18s ease,background .18s ease;
  }
  .btn:hover{transform:translateY(-2px)}
  .btn:focus-visible{outline:3px solid rgba(31,122,224,.35);outline-offset:3px}
  .primary{background:var(--blue);color:#fff;box-shadow:0 12px 26px rgba(31,122,224,.3)}
  .primary:hover{background:var(--blue-d)}
  .ghost{border:1.5px solid #bdd8f5;background:#fff;color:var(--blue-d)}
  .ghost:hover{background:#eff7ff}
  .hint{margin:0;color:#6e7e98;font-size:13px}
  footer{position:relative;z-index:2;padding:0 20px 24px;text-align:center;color:#3f648d;font-size:12.5px}
  @media (max-width:640px){
    main{margin-top:20px;padding:30px 20px 34px;border-radius:26px}
    .actions{flex-direction:column}
    .btn{width:100%}
  }
  @media (prefers-reduced-motion:reduce){
    *,*::before,*::after{animation:none!important;transition:none!important}
  }
</style>
</head>
<body>
  <div class="brand"><span aria-hidden="true">🐦</span>小鹏友的APEC朋友圈</div>
  <main>
    <p class="badge">404 · 这条小路没有点亮</p>
    <div class="bird" aria-hidden="true">🐦</div>
    <div class="code" aria-hidden="true">404</div>
    <h1>这只小鹏友迷路了</h1>
    <p class="lead">这条小路还没有点亮。你访问的页面不存在，或者已经搬到别处去了。<br>别担心，回到有灯光的地方就好。</p>
    <div class="actions">
      <a class="btn primary" href="http://119.91.33.40/">返回主站</a>
      <a class="btn ghost" href="https://dingyubin.github.io/apec-kids-site/">返回 GitHub Pages</a>
    </div>
    <p class="hint">深圳的一盏小灯，正在等你回来。</p>
  </main>
  <footer>小鹏友的APEC朋友圈 · 深圳市南山区</footer>
</body>
</html>
